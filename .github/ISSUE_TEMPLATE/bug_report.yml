name: Bug report
description: The guide showed something wrong, or the plugin misbehaved
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the guide showed, and what you expected it to show.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which Gauntlet and tier, your weapon and armor settings, and what you did leading up to it.
      placeholder: |
        1. Corrupted Gauntlet, T1 armor goal
        2. Lit the third room of the opening
        3. The current task pointed at ...
    validations:
      required: true
  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: >-
        Turn on the Log attempts setting before the run, then attach the attempt's .jsonl file from
        ~/.runelite/plugin-data/gauntlet-helper/attempts. It shows what the plugin saw and said at every tick, which makes a
        guidance bug much easier to reproduce.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown on the plugin's Plugin Hub page.
    validations:
      required: false
